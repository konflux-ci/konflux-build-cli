kind: Pipeline
apiVersion: tekton.dev/v1
metadata:
  name: konflux-build-cli-unit-tests
spec:
  params:
    - description: 'Snapshot of the application'
      name: SNAPSHOT
      type: string
  tasks:
    - name: run-unit-tests
      params:
        - name: SNAPSHOT
          value: "$(params.SNAPSHOT)"
      taskSpec:
        stepTemplate:
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        steps:
          - name: clone
            image: quay.io/konflux-ci/task-runner:4.0.0@sha256:ab7440e1101af1ff0418e16badede2f1590664d3189099030bf3f782371bd9da
            env:
              - name: PARAM_SNAPSHOT
                value: "$(params.SNAPSHOT)"
            script: |
              #!/bin/bash
              set -ex

              jq -c '.components[0]' >/tmp/component.json <<< "${PARAM_SNAPSHOT}"
              git_url=$(jq -r '.source.git.url' </tmp/component.json)
              git_revision=$(jq -r '.source.git.revision' </tmp/component.json)

              git clone "$git_url" /source
              git config --global --add safe.directory /source

              cd /source
              git checkout "$git_revision"

              # Extract metadata for downstream steps because checkout leaves detached HEAD
              branch=$(git branch -r --points-at HEAD | head -1 | sed 's|.*origin/||; s|^[[:space:]]*||')
              slug=$(echo "$git_url" | sed -E 's|.*github\.com[:/]||; s|\.git$||')
              printf '%s\n%s\n%s\n' "$git_revision" "${branch:-main}" "$slug" > /source/.git-metadata
            volumeMounts:
            - name: source
              mountPath: /source
          - name: stage-go-toolchain
            # The task-runner image has the all the tools except Go and installing one with microdnf
            # would mean running the tests as root. Copy the go toolchain from the go-toolset image
            image: registry.access.redhat.com/ubi10/go-toolset:1.26.10@sha256:e94c38ff4a099b755af60c73ac87198c613f369eb7f818d45c96fbc3f21047de
            script: |
              #!/bin/bash
              set -ex
              # The image's HOME (/opt/app-root/src) is only writable by uid 1001,
              # while the cluster assigns the step a UID of its own. Point HOME at a
              # writable directory, otherwise 'go' fails to create its module cache.
              export HOME=/tmp
              goroot=$(go env GOROOT)
              cp -a "$goroot" /toolchain/go
            volumeMounts:
            - name: go-toolchain
              mountPath: /toolchain
          - name: run-tests
            image: quay.io/konflux-ci/task-runner:4.0.0@sha256:ab7440e1101af1ff0418e16badede2f1590664d3189099030bf3f782371bd9da
            computeResources:
              requests:
                memory: 4Gi
              limits:
                memory: 4Gi
            script: |
              #!/bin/bash
              set -ex
              export PATH="/toolchain/go/bin:$PATH"
              export HOME=/tmp
              cd /source
              make unit-test-courtney
            volumeMounts:
            - name: source
              mountPath: /source
            - name: go-toolchain
              mountPath: /toolchain
          - name: upload-coverage
            image: quay.io/konflux-ci/task-runner:4.0.0@sha256:ab7440e1101af1ff0418e16badede2f1590664d3189099030bf3f782371bd9da
            onError: continue
            script: |
              #!/bin/bash
              cd /source

              if ! token=$(cat /secrets/codecov/CODECOV_TOKEN); then
                echo "WARNING: Codecov token not available, skipping upload"
                exit 1
              fi
              export CODECOV_TOKEN="$token"

              curl -Os https://cli.codecov.io/v11.2.8/linux/codecov
              if ! echo "8930c4bb30254a42f3d8c340706b1be340885e20c0df5160a24efa2e030e662b  codecov" | sha256sum -c -; then
                echo "WARNING: Codecov CLI checksum verification failed, skipping upload"
                exit 1
              fi
              chmod +x codecov
              COMMIT_SHA=$(sed -n '1p' /source/.git-metadata)
              BRANCH=$(sed -n '2p' /source/.git-metadata)
              SLUG=$(sed -n '3p' /source/.git-metadata)
              ./codecov upload-process \
                --flag unit-tests \
                --file cover-courtney.out \
                --commit-sha "${COMMIT_SHA}" \
                --branch "${BRANCH}" \
                --slug "${SLUG}" \
                --git-service github || echo "WARNING: Coverage upload failed"
            volumeMounts:
            - name: source
              mountPath: /source
            - name: codecov-token
              mountPath: /secrets/codecov
              readOnly: true
        volumes:
        - name: source
          emptyDir: {}
        - name: go-toolchain
          emptyDir: {}
        - name: codecov-token
          secret:
            secretName: codecov-token
            defaultMode: 0444
