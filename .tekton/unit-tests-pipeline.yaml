kind: Pipeline
apiVersion: tekton.dev/v1
metadata:
  name: konflux-build-cli-unit-tests
spec:
  params:
    - description: 'Snapshot of the application'
      name: SNAPSHOT
      type: string
  tasks:
    - name: run-unit-tests
      params:
        - name: SNAPSHOT
          value: "$(params.SNAPSHOT)"
      taskSpec:
        # Every step handles data derived from the SNAPSHOT and run-tests compiles
        # and executes the cloned source, so keep all of them unprivileged.
        # runAsUser is deliberately left unset: the images default to a non-root
        # user, and clusters that allocate UIDs per namespace assign their own.
        stepTemplate:
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
        steps:
          - name: clone
            image: quay.io/konflux-ci/task-runner:3.3.0@sha256:0428af436f6942544009e38ef452a6b747e9ec79ab22fd402a3d59585984cf81
            env:
              - name: PARAM_SNAPSHOT
                value: "$(params.SNAPSHOT)"
            script: |
              #!/bin/bash
              set -ex

              jq -c '.components[0]' >/tmp/component.json <<< "${PARAM_SNAPSHOT}"
              git_url=$(jq -r '.source.git.url' </tmp/component.json)
              git_revision=$(jq -r '.source.git.revision' </tmp/component.json)

              git clone "$git_url" /source
              git config --global --add safe.directory /source

              cd /source
              git checkout "$git_revision"

              # Extract metadata for downstream steps because checkout leaves detached HEAD
              branch=$(git branch -r --points-at HEAD | head -1 | sed 's|.*origin/||; s|^[[:space:]]*||')
              slug=$(echo "$git_url" | sed -E 's|.*github\.com[:/]||; s|\.git$||')
              printf '%s\n%s\n%s\n' "$git_revision" "${branch:-main}" "$slug" > /source/.git-metadata
            volumeMounts:
            - name: source
              mountPath: /source
          - name: stage-go-toolchain
            # The tests need both a Go toolchain and the CLI tools they exercise
            # (skopeo, buildah, ...). The task-runner image has the tools but no Go,
            # and installing one with microdnf would mean running the tests as root.
            # Copy the toolchain out of the image the Dockerfile builds with instead,
            # and keep that image reference in sync with the Dockerfile.
            image: registry.access.redhat.com/ubi10/go-toolset:1.26.10@sha256:557f358c83892a8b94fb72649a99e1c303a625d240547fb97a9cbc1620e808c0
            script: |
              #!/bin/bash
              set -ex
              # The image's HOME (/opt/app-root/src) is only writable by uid 1001,
              # while the cluster assigns the step a UID of its own. Point HOME at a
              # writable directory, otherwise 'go' fails to create its module cache.
              export HOME=/tmp
              # Assign first: a failing command substitution only aborts the step
              # under 'set -e' when it is the whole right-hand side of an assignment.
              goroot=$(go env GOROOT)
              # Copy into a sub-directory: the mount point itself is owned by root,
              # so 'cp -a' must not try to apply the source attributes to it.
              cp -a "$goroot" /toolchain/go
            volumeMounts:
            - name: go-toolchain
              mountPath: /toolchain
          - name: run-tests
            image: quay.io/konflux-ci/task-runner:3.3.0@sha256:0428af436f6942544009e38ef452a6b747e9ec79ab22fd402a3d59585984cf81
            computeResources:
              requests:
                memory: 4Gi
              limits:
                memory: 4Gi
            script: |
              #!/bin/bash
              set -ex
              export PATH="/toolchain/go/bin:$PATH"
              cd /source
              go test -tags exclude_graphdriver_btrfs -coverprofile=coverage.out -covermode=atomic ./pkg/...
            volumeMounts:
            - name: source
              mountPath: /source
            - name: go-toolchain
              mountPath: /toolchain
          - name: upload-coverage
            image: quay.io/konflux-ci/task-runner:3.3.0@sha256:0428af436f6942544009e38ef452a6b747e9ec79ab22fd402a3d59585984cf81
            onError: continue
            env:
              - name: CODECOV_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: codecov-token
                    key: CODECOV_TOKEN
            script: |
              #!/bin/bash
              cd /source

              curl -Os https://cli.codecov.io/v11.2.8/linux/codecov
              if ! echo "8930c4bb30254a42f3d8c340706b1be340885e20c0df5160a24efa2e030e662b  codecov" | sha256sum -c -; then
                echo "WARNING: Codecov CLI checksum verification failed, skipping upload"
                exit 1
              fi
              chmod +x codecov
              COMMIT_SHA=$(sed -n '1p' /source/.git-metadata)
              BRANCH=$(sed -n '2p' /source/.git-metadata)
              SLUG=$(sed -n '3p' /source/.git-metadata)
              ./codecov upload-process \
                --token "${CODECOV_TOKEN}" \
                --flag unit-tests \
                --file coverage.out \
                --commit-sha "${COMMIT_SHA}" \
                --branch "${BRANCH}" \
                --slug "${SLUG}" \
                --git-service github || echo "WARNING: Coverage upload failed"
            volumeMounts:
            - name: source
              mountPath: /source
        volumes:
        - name: source
          emptyDir: {}
        - name: go-toolchain
          emptyDir: {}
