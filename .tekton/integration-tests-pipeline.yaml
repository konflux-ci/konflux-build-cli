kind: Pipeline
apiVersion: tekton.dev/v1
metadata:
  name: konflux-build-cli-integration-tests
spec:
  params:
    - name: SNAPSHOT
      type: string
      description: 'Snapshot of the application'
    - name: host-access-secret-name
      type: string
      description: 'secret name containing the ssh credentials'
      default: ssh-secrets-$(context.pipelineRun.name)
  tasks:
    - name: provision-virtual-machine
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          # using a stable version of fedora-vm-provision task, need to be updated when next stable version of the task is available
          - name: revision
            value: af63e976717a238fb98c973f27a660b2652b0f09
          - name: pathInRepo
            value: tasks/mapt-oci/fedora-virtual-machine/provision/0.2/fedora-vm-provision.yaml
      params:
        - name: secret-aws-credentials
          value: mapt-kind-secret
        - name: id
          value: $(context.pipelineRun.name)
        - name: host-access-secret-name
          value: $(params.host-access-secret-name)
        - name: tags
          value: 'owner=konflux-devprod@redhat.com,project=Konflux,created-by=integration-pipeline,component=konflux-build-cli'
        - name: ownerKind
          value: PipelineRun
        - name: ownerName
          value: $(context.pipelineRun.name)
        - name: ownerUid
          value: $(context.pipelineRun.uid)
        - name: spot
          value: 'true'
        - name: compute-families
          # Limit selectable machine types to prevent mapt from trying to use an unavailable type.
          # The m* families are general purpose, with a 4:1 memory:cpu ratio
          # (important, because the task looks for a machine with 16Gi memory and 4 CPU by default).
          value: m5,m5a,m5d,m6a,m6i
        - name: debug
          value: 'false'
    - name: run-integration-tests
      runAfter:
        - provision-virtual-machine
      params:
        - name: SNAPSHOT
          value: "$(params.SNAPSHOT)"
      taskSpec:
        steps:
          - name: clone-repo-and-run-tests
            image: quay.io/konflux-ci/task-runner:3.3.0@sha256:0428af436f6942544009e38ef452a6b747e9ec79ab22fd402a3d59585984cf81
            env:
            - name: PARAM_SNAPSHOT
              value: "$(params.SNAPSHOT)"
            volumeMounts:
            - name: host-access
              mountPath: /secrets/ssh
              readOnly: true
            script: |
              #!/bin/bash
              set -e

              USERNAME=$(cat /secrets/ssh/username)
              HOST=$(cat /secrets/ssh/host)

              # Setup local SSH configuration directory (client config only, no key material)
              mkdir -p ~/.ssh
              chmod 700 ~/.ssh


              if [[ ! -s /secrets/ssh/host-public-key ]]; then
                echo 'ERROR: host public key is empty — provision could not scan the VM host key' >&2
                exit 1
              fi
              # add host-public-key to the known_hosts file, instead of blindly trusting the host
              printf '%s\n' "$(cat /secrets/ssh/host-public-key)" > ~/.ssh/known_hosts
              chmod 600 ~/.ssh/known_hosts
              echo "StrictHostKeyChecking yes" >> ~/.ssh/config

              # Extract git_url and git_revision from snapshot
              jq -c '.components[0]' >/tmp/component.json <<< "${PARAM_SNAPSHOT}"
              git_url=$(jq -r '.source.git.url' </tmp/component.json)
              git_revision=$(jq -r '.source.git.revision' </tmp/component.json)

              # Validate git_url and git_revision
              [[ -z "$git_url" || "$git_url" == "null" ]] && echo 'ERROR: git_url not found in SNAPSHOT' && exit 1
              [[ -z "$git_revision" || "$git_revision" == "null" ]] && echo 'ERROR: git_revision not found in SNAPSHOT' && exit 1

              # SNAPSHOT is normally written by trusted controllers, but anyone able to create
              # or override a Snapshot in the tenant namespace can set this URL, and it ends up
              # on a remote shell's command line. Validate it as strictly as the revision:
              # an https GitHub owner/repo URL and nothing else. The character classes exclude
              # every shell metacharacter.
              if [[ $git_url =~ ^https://github\.com/[A-Za-z0-9._-]+/[A-Za-z0-9._-]+(\.git)?$ ]]; then
                echo "Valid Git URL."
              else
                echo "Error: Invalid Git URL format." >&2
                exit 1
              fi

              if [[ $git_revision =~ ^[0-9a-f]{40}$ ]]; then
                echo "Valid Git SHA."
              else
                echo "Error: Invalid Git revision format." >&2
                exit 1
              fi

              # 'go test' runs completely silently, which makes the connection look idle.
              # Send "heartbeat" packets every 60 seconds to prevent the connection from dropping.
              ssh_opts=(-o ServerAliveInterval=60)

              # Login and execute the script remotely.
              # The heredoc delimiter is quoted, so the script below is sent verbatim and is
              # never expanded on this side. The two snapshot-derived values are base64-encoded
              # before they are placed on the remote command line: the base64 alphabet contains
              # no shell metacharacters, so the remote shell cannot reinterpret them as code.
              echo "Connecting to ${HOST} as ${USERNAME} ..."
              git_url_b64=$(printf '%s' "$git_url" | base64 -w0)
              git_revision_b64=$(printf '%s' "$git_revision" | base64 -w0)
              ssh -i /secrets/ssh/id_rsa "${ssh_opts[@]}" "${USERNAME}@${HOST}" \
                "GIT_URL_B64=${git_url_b64} GIT_REVISION_B64=${git_revision_b64} bash -s" << 'EOF'
                set -e

                git_url=$(printf '%s' "$GIT_URL_B64" | base64 -d)
                git_revision=$(printf '%s' "$GIT_REVISION_B64" | base64 -d)

                # install the tools needed for running the tests
                sudo dnf install git golang httpd-tools -y

                # Clone the repo
                mkdir -p ~/source
                git clone "$git_url" ~/source
                git config --global --add safe.directory ~/source
                cd ~/source
                git checkout "$git_revision"

                # Run the integration tests
                GOTOOLCHAIN=auto go test -tags exclude_graphdriver_btrfs -timeout 20m ./integration_tests
              EOF
        volumes:
        - name: host-access
          secret:
            secretName: $(params.host-access-secret-name)
            defaultMode: 0444
  finally:
    - name: deprovision-virtual-machine
      taskRef:
        resolver: git
        params:
          - name: url
            value: https://github.com/konflux-ci/tekton-integration-catalog.git
          # using a stable version of fedora-vm-deprovision task, need to be updated when next stable version of the task is available
          - name: revision
            value: 1eb7c59d5530fd1f37d64ace8eea25f2649e887d
          - name: pathInRepo
            value: tasks/mapt-oci/fedora-virtual-machine/deprovision/0.1/fedora-vm-deprovision.yaml
      params:
        - name: secret-aws-credentials
          value: mapt-kind-secret
        - name: id
          value: $(context.pipelineRun.name)
